[package]
name = "stegpony-core"
description = "StegPony steganography core: headerless encrypted envelopes hidden in images and text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
argon2 = { version = "0.6.0", features = ["parallel"] }
bech32 = "0.12.0"
chacha20poly1305 = "0.11.0"
curve25519-elligator2 = "0.1.0-alpha.2"
hkdf = "0.13.0"
png = "0.18.1"
rand_core = { version = "0.6", features = ["getrandom"] }
rayon = "1.12.0"
sha2 = "0.11.0"
siphasher = "1.0.4"
subtle = "2.6.1"
thiserror = "2.0.21"
unicode-normalization = "0.1.25"
zeroize = { version = "1.9.1", features = ["derive"] }
zune-jpeg = "0.4"

[dev-dependencies]
age = "0.12.1"
rand_chacha = "0.3"
serde_json = "1.0.140"
zeroize = "1.9.1"
