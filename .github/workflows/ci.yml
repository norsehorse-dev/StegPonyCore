name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux and macOS (arm64) both run the full suite: the format has to come
        # out bit-exact on every platform the apps build for.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        # The version comes from rust-toolchain.toml; rustup installs it on first use.
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked --workspace --all-targets

      - name: Test
        # Fixtures under crates/stegpony-core/tests/fixtures are committed and are
        # what the tests use. tools/make_fixtures.py is not re-run here because its
        # output depends on the Pillow and NumPy versions installed.
        run: cargo test --locked --workspace

      - name: Generate the Kotlin bindings
        # The same generation step StegPonyAndroid's build runs, so a binding the
        # generator rejects fails here first.
        run: |
          lib=target/debug/libstegpony_ffi.so
          [ -f "$lib" ] || lib=target/debug/libstegpony_ffi.dylib
          cargo run --locked -q -p stegpony-ffi --features cli --bin uniffi-bindgen -- \
            generate --library "$lib" --language kotlin --no-format --out-dir "$RUNNER_TEMP/bindings"
          test -s "$RUNNER_TEMP/bindings/uniffi/stegpony_ffi/stegpony_ffi.kt"

  vectors:
    name: Independent check of the format vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install checker dependencies
        run: pip install argon2-cffi cryptography pillow numpy jpeglib

      - name: Check vectors against FORMAT.md
        run: python3 tools/check_vectors.py

  jpeg:
    name: JPEG codec against libjpeg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install checker dependencies
        run: pip install numpy pillow jpeglib

      - name: Build helper
        run: cargo build --locked --release --example jpeg_tool

      - name: Compare with libjpeg, libjpeg-turbo and mozjpeg
        run: python3 tools/check_jpeg.py

      - name: Check channel preparation with independent libjpeg decoding
        run: python3 tools/check_channel_prep.py

  msrv:
    name: Minimum supported Rust (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust 1.88
        uses: dtolnay/rust-toolchain@1.88

      - uses: Swatinem/rust-cache@v2

      - name: Build
        # rust-toolchain.toml pins the release toolchain, so name 1.88 explicitly.
        # stegpony-ffi is left out: UniFFI's dependency tree needs a newer Rust.
        run: cargo +1.88 build --locked --workspace --exclude stegpony-ffi
